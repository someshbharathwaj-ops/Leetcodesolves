name: Auto Count LeetCode Problems

on:
  push:
    branches:
      - main

jobs:
  count:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Count problems
        run: |
          EASY=$(find . -type f -path "*EASY*" | wc -l)
          MEDIUM=$(find . -type f -path "*MEDIUM*" | wc -l)
          HARD=$(find . -type f -path "*HARD*" | wc -l)
          TOTAL=$((EASY + MEDIUM + HARD))

          echo "EASY=$EASY" >> $GITHUB_ENV
          echo "MEDIUM=$MEDIUM" >> $GITHUB_ENV
          echo "HARD=$HARD" >> $GITHUB_ENV
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV

      - name: Update README
        run: |
          sed -i "s/- 🟢 Easy:.*/- 🟢 Easy: $EASY/" README.md
          sed -i "s/- 🟡 Medium:.*/- 🟡 Medium: $MEDIUM/" README.md
          sed -i "s/- 🔴 Hard:.*/- 🔴 Hard: $HARD/" README.md
          sed -i "s/- Total Solved:.*/- Total Solved: $TOTAL/" README.md

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add README.md
          git commit -m "Auto update problem count" || echo "No changes"
          git push